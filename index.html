<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Aylıq Qiymətləndirmə Protokolu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&family=Literata:opsz,wght@7..72,600;7..72,700&display=swap">
<style>
/* Layout: a class register. Masthead, a sticky tab strip, a context bar (month · class · subject),
   then the register sheet: one row per student, five criteria marked 1–5, the average at the end. */
:root {
  --paper: #f1f3f7;
  --sheet: #ffffff;
  --sheet-2: #f6f7fa;
  --ink: #161c28;
  --ink-2: #4f596b;
  --ink-3: #7f899b;
  --rule: #dfe3ea;
  --rule-2: #c5ccd8;
  --accent: #2b45a9;
  --accent-ink: #ffffff;
  --accent-soft: #e8ecfa;
  --ok: #17784a;
  --warn-bg: #fff6e3;
  --warn-ink: #6f4700;
  --warn-rule: #efd59d;
  --bad: #b3261e;
  --g1: #bf2f25; --g2: #c4521b; --g3: #d6a21a; --g4: #4b8a26; --g5: #18804b;
  --g1-on: #ffffff; --g2-on: #ffffff; --g3-on: #231800; --g4-on: #ffffff; --g5-on: #ffffff;
  --g1-text: #a8281f; --g2-text: #a2420f; --g3-text: #7c5800; --g4-text: #3c731c; --g5-text: #136b3e;
  --shadow: 0 1px 2px rgba(22, 28, 40, 0.06), 0 6px 18px rgba(22, 28, 40, 0.05);
  --font-display: "Literata", Georgia, "Times New Roman", serif;
  --font-ui: "Commissioner", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --tabbar-h: 48px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0b0f15; --sheet: #131922; --sheet-2: #18202b;
    --ink: #e3e8f0; --ink-2: #a4aec0; --ink-3: #75808f;
    --rule: #232c3a; --rule-2: #334058;
    --accent: #93a8ff; --accent-ink: #0b0f15; --accent-soft: #1a2448;
    --ok: #5fd197; --warn-bg: #2b2311; --warn-ink: #f1cf88; --warn-rule: #574417; --bad: #ff8a80;
    --g1: #ff7d70; --g2: #ff9f61; --g3: #f3c652; --g4: #a3d46e; --g5: #58cf8f;
    --g1-on: #2a0905; --g2-on: #2a1203; --g3-on: #241a00; --g4-on: #0f1c05; --g5-on: #04200f;
    --g1-text: #ff9c92; --g2-text: #ffb582; --g3-text: #f5d67f; --g4-text: #bfe59a; --g5-text: #82e0ad;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--sheet);
}
img { max-width: 100%; }
button, input, select, textarea { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.wrap {
  width: 100%;
  max-width: 1240px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead + tabs */
.masthead { background: var(--sheet); padding-top: env(safe-area-inset-top, 0px); }
.mast-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 20px;
  padding-block: 18px 10px;
}
.brand { min-width: 0; }
.brand h1 {
  margin: 0;
  font: 650 clamp(21px, 2.6vw, 27px)/1.15 var(--font-display);
  letter-spacing: -0.012em;
  text-wrap: balance;
}
.brand p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.who { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; min-width: 0; }
.who-text { min-width: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
.who-text b { display: block; color: var(--ink); font-weight: 600; font-size: 14px; }
.tabbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 6;
  background: var(--sheet);
  border-bottom: 1px solid var(--rule);
}
.tabs { display: flex; gap: 2px; height: var(--tabbar-h); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none;
  appearance: none;
  margin: 0;
  padding: 0 14px;
  border: 0;
  border-bottom: 2.5px solid transparent;
  background: none;
  color: var(--ink-2);
  font-weight: 600;
  font-size: 14.5px;
  cursor: pointer;
}
.tab:first-child { padding-left: 2px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .short { display: none; }
@media (max-width: 520px) {
  .tab { padding: 0 9px; font-size: 14px; }
  .tab .long { display: none; }
  .tab .short { display: inline; }
}

/* Context bar */
.main { padding-block: 4px calc(72px + env(safe-area-inset-bottom, 0px)); }
.context {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px 16px;
  padding-block: 16px 14px;
}
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lab {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.monthstep {
  display: flex;
  align-items: stretch;
  height: 44px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background: var(--sheet);
  overflow: hidden;
}
.monthstep button { width: 42px; border: 0; background: none; color: var(--ink-2); font-size: 21px; line-height: 1; cursor: pointer; }
.monthstep button:hover { background: var(--sheet-2); color: var(--ink); }
.monthstep output {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-width: 140px;
  padding-inline: 6px;
  border-inline: 1px solid var(--rule);
  font-weight: 600;
  font-size: 15px;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.monthstep output small { font-size: 11px; font-weight: 500; color: var(--ink-3); }
select {
  height: 44px;
  max-width: 100%;
  min-width: 120px;
  padding: 0 12px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background-color: var(--sheet);
  color: var(--ink);
  font-size: 16px;
  font-weight: 500;
}
#subjSel { min-width: 190px; }
.savestate { margin-left: auto; display: flex; align-items: center; gap: 7px; min-height: 44px; font-size: 13px; color: var(--ink-2); }
.savestate::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.savestate:empty { display: none; }
.savestate[data-s="saved"]::before { background: var(--ok); }
.savestate[data-s="saving"]::before { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.savestate[data-s="retry"]::before, .savestate[data-s="error"]::before { background: var(--bad); }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (max-width: 600px) {
  .context .field { flex: 1 1 150px; }
  .context select, .monthstep { width: 100%; }
  .monthstep output { flex: 1; min-width: 0; }
  .savestate { min-height: 0; }
}

.notice {
  margin: 0 0 14px;
  padding: 12px 14px;
  border: 1px solid var(--warn-rule);
  border-radius: 10px;
  background: var(--warn-bg);
  color: var(--warn-ink);
  font-size: 14px;
}

/* Login and messages */
.login { display: grid; justify-items: center; padding-block: 7vh 40px; }
.login-card {
  display: grid;
  gap: 14px;
  width: min(420px, 100%);
  padding: 24px 22px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--sheet);
  box-shadow: var(--shadow);
}
.login-card h2 { margin: 0; font: 650 24px/1.2 var(--font-display); }
.login-card p { margin: 0; font-size: 14px; color: var(--ink-2); }
.err { min-height: 1.3em; margin: 0; color: var(--bad); font-size: 14px; }
input[type="text"], input[type="password"] {
  width: 100%;
  height: 46px;
  padding: 0 12px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  font-size: 16px;
}
.inp { display: grid; gap: 6px; min-width: 0; }
.msg { padding-block: 24px; }

/* Shared pieces */
.sheet-head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px 16px;
  margin: 4px 0 12px;
}
.sheet-title { min-width: 0; }
.sheet-head h2 { margin: 0; font: 650 clamp(19px, 2.2vw, 23px)/1.2 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.meta { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.progress { width: min(220px, 100%); }
.bar { height: 6px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.bar i { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.3s ease; }
.legend { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 18px; margin: 0 0 12px; font-size: 13px; color: var(--ink-2); }
.legend-scale { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.lg { white-space: nowrap; }
.lg b { display: inline-grid; place-items: center; width: 20px; height: 20px; margin-right: 3px; border-radius: 5px; font-size: 12px; }
.lg[data-g="1"] b, .g[data-g="1"] { background: var(--g1); color: var(--g1-on); }
.lg[data-g="2"] b, .g[data-g="2"] { background: var(--g2); color: var(--g2-on); }
.lg[data-g="3"] b, .g[data-g="3"] { background: var(--g3); color: var(--g3-on); }
.lg[data-g="4"] b, .g[data-g="4"] { background: var(--g4); color: var(--g4-on); }
.lg[data-g="5"] b, .g[data-g="5"] { background: var(--g5); color: var(--g5-on); }
.hint { color: var(--ink-3); }
.banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 0 0 12px;
  padding: 10px 12px 10px 14px;
  border-radius: 10px;
  background: var(--accent-soft);
  font-size: 14px;
}
.banner.bad { background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-rule); }
.avg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 52px;
  height: 28px;
  padding: 0 9px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--sheet-2);
  color: var(--ink-3);
  font-weight: 700;
  font-size: 13.5px;
  font-variant-numeric: tabular-nums;
}
.avg.big { min-width: 60px; height: 32px; font-size: 15px; }
.avg[data-g="1"] { color: var(--g1-text); background: color-mix(in srgb, var(--g1) 14%, var(--sheet)); border-color: color-mix(in srgb, var(--g1) 38%, var(--sheet)); }
.avg[data-g="2"] { color: var(--g2-text); background: color-mix(in srgb, var(--g2) 14%, var(--sheet)); border-color: color-mix(in srgb, var(--g2) 38%, var(--sheet)); }
.avg[data-g="3"] { color: var(--g3-text); background: color-mix(in srgb, var(--g3) 16%, var(--sheet)); border-color: color-mix(in srgb, var(--g3) 42%, var(--sheet)); }
.avg[data-g="4"] { color: var(--g4-text); background: color-mix(in srgb, var(--g4) 14%, var(--sheet)); border-color: color-mix(in srgb, var(--g4) 38%, var(--sheet)); }
.avg[data-g="5"] { color: var(--g5-text); background: color-mix(in srgb, var(--g5) 14%, var(--sheet)); border-color: color-mix(in srgb, var(--g5) 38%, var(--sheet)); }
.g { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; font-weight: 700; font-size: 13.5px; }
.dash { color: var(--ink-3); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 40px;
  padding: 0 15px;
  border: 1px solid var(--rule-2);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  font-weight: 600;
  font-size: 14.5px;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.small { height: 34px; padding: 0 11px; border-radius: 8px; font-size: 13.5px; }
.btn.wide { width: 100%; height: 46px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }

.empty {
  display: grid;
  justify-items: start;
  gap: 10px;
  max-width: 680px;
  padding: 26px 22px;
  border: 1px dashed var(--rule-2);
  border-radius: 14px;
  background: var(--sheet);
}
.empty h2 { margin: 0; font: 650 20px/1.25 var(--font-display); }
.empty p { margin: 0; max-width: 62ch; color: var(--ink-2); }
.empty.loading p { color: var(--ink-3); }

/* Register (grade entry) */
.register { border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); }
.rhead { display: none; }
.srow {
  display: grid;
  grid-template-columns: 26px minmax(0, 1fr) auto;
  grid-template-areas: "no name avg" "crits crits crits";
  align-items: center;
  gap: 10px;
  padding: 14px 14px 16px;
  border-top: 1px solid var(--rule);
}
.srow:nth-child(2) { border-top: 0; }
.sno { grid-area: no; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sname { grid-area: name; min-width: 0; font-weight: 600; font-size: 15.5px; overflow-wrap: anywhere; }
.savg { grid-area: avg; }
.crits { grid-area: crits; display: grid; gap: 8px; }
.crit { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.clabel { min-width: 0; font-size: 13.5px; color: var(--ink-2); }
.seg { display: flex; flex: none; gap: 5px; }
.seg button {
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--rule-2);
  border-radius: 9px;
  background: var(--sheet);
  color: var(--ink-2);
  font-weight: 600;
  font-size: 16px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
  transition: background-color 0.12s, border-color 0.12s, color 0.12s;
}
.seg button:hover:not(:disabled) { border-color: var(--ink-3); color: var(--ink); }
.seg button[aria-pressed="true"][data-v="1"] { background: var(--g1); border-color: var(--g1); color: var(--g1-on); }
.seg button[aria-pressed="true"][data-v="2"] { background: var(--g2); border-color: var(--g2); color: var(--g2-on); }
.seg button[aria-pressed="true"][data-v="3"] { background: var(--g3); border-color: var(--g3); color: var(--g3-on); }
.seg button[aria-pressed="true"][data-v="4"] { background: var(--g4); border-color: var(--g4); color: var(--g4-on); }
.seg button[aria-pressed="true"][data-v="5"] { background: var(--g5); border-color: var(--g5); color: var(--g5-on); }
.seg button:disabled { cursor: default; opacity: 0.5; }
.seg button[aria-pressed="true"]:disabled { opacity: 0.85; }
@media (max-width: 380px) {
  .seg { gap: 4px; }
  .seg button { width: 36px; height: 38px; }
}
@media (min-width: 1000px) {
  .rhead, .srow {
    display: grid;
    grid-template-columns: 30px minmax(150px, 1.2fr) repeat(5, minmax(118px, 1fr)) 64px;
    grid-template-areas: none;
    column-gap: 14px;
    align-items: center;
  }
  .rhead {
    position: sticky;
    top: calc(env(safe-area-inset-top, 0px) + var(--tabbar-h));
    z-index: 3;
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    border-radius: 14px 14px 0 0;
    background: var(--sheet-2);
    color: var(--ink-3);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    line-height: 1.25;
    text-transform: uppercase;
  }
  .rhead span:last-child { text-align: center; }
  .srow { padding: 7px 14px; }
  .srow:hover { background: var(--sheet-2); }
  .sno, .sname, .savg { grid-area: auto; }
  .crits { display: contents; }
  .clabel { display: none; }
  .seg { width: 100%; gap: 4px; }
  .seg button { flex: 1 1 0; width: auto; min-width: 0; height: 32px; border-radius: 7px; font-size: 14.5px; }
  .savg { text-align: center; }
}

/* Psychologist notes */
.notes { display: grid; gap: 10px; }
@media (min-width: 900px) { .notes { grid-template-columns: 1fr 1fr; } }
.note-row { display: grid; gap: 8px; min-width: 0; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.note-head { display: flex; align-items: baseline; gap: 10px; }
textarea {
  width: 100%;
  min-height: 64px;
  resize: vertical;
  padding: 9px 11px;
  border: 1px solid var(--rule-2);
  border-radius: 9px;
  background: var(--sheet-2);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.45;
}
textarea:focus { background: var(--sheet); }
.count { justify-self: end; min-height: 1em; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* Reports */
.completion { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 0 0 16px; }
.comp { display: grid; gap: 7px; min-width: 0; padding: 11px 13px; border: 1px solid var(--rule); border-radius: 12px; background: var(--sheet); }
.comp-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.comp-name { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.comp-num { flex: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.comp-who { min-height: 1.2em; font-size: 12.5px; color: var(--ink-3); overflow-wrap: anywhere; }
.comp.full .bar i { background: var(--ok); }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 14px; background: var(--sheet); box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rep th {
  padding: 10px 12px;
  border-bottom: 1px solid var(--rule);
  background: var(--sheet-2);
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  line-height: 1.25;
  text-align: left;
  text-transform: uppercase;
  vertical-align: bottom;
}
.rep td { padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.rep > tbody > tr:last-child > td { border-bottom: 0; }
.rep .c-no { width: 38px; color: var(--ink-3); font-size: 13px; }
.col-subj { display: none; }
@media (min-width: 880px) { .col-subj { display: table-cell; } .rep th.col-subj { max-width: 120px; } }
.ta-c { text-align: center !important; }
.ta-r { text-align: right !important; }
.linkish { display: grid; gap: 1px; margin: 0; padding: 2px 0; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; }
.linkish .sname { font-weight: 600; }
.linkish .sub { font-size: 12.5px; color: var(--ink-3); }
.linkish:hover .sname { color: var(--accent); }
.rep tr.open > td, .rep tr.detail > td { background: var(--sheet-2); }
.rep tr.detail > td { padding: 2px 12px 16px; }
.detail-inner { display: grid; gap: 12px; }
@media (min-width: 880px) { .detail-inner { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; } }
.mini-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 10px; background: var(--sheet); }
.mini th { padding: 8px 10px; border-bottom: 1px solid var(--rule); color: var(--ink-3); font-size: 11px; font-weight: 600; line-height: 1.2; text-align: left; }
.mini td { padding: 6px 10px; border-bottom: 1px solid var(--rule); font-size: 14px; }

<script>
(function () {
"use strict";

/* ===== Core: criteria, months, averages, PDF protocol. Pure functions, no DOM. ===== */
const CRITERIA = [
  { key: "a", label: "Akademik nailiyyətlər", head: "Akademik\nnailiyyətlər" },
  { key: "h", label: "Dərsə hazırlıq", head: "Dərsə\nhazırlıq" },
  { key: "i", label: "Dərsdə iştirak", head: "Dərsdə\niştirak" },
  { key: "n", label: "Nizam-intizam", head: "Nizam-\nintizam" },
  { key: "d", label: "Davamiyyət", head: "Davamiyyət" }
];
const SCALE = [
  { v: 5, word: "əla" },
  { v: 4, word: "yaxşı" },
  { v: 3, word: "kafi" },
  { v: 2, word: "qeyri-kafi" },
  { v: 1, word: "çox zəif" }
];
const MONTHS_AZ = ["Yanvar", "Fevral", "Mart", "Aprel", "May", "İyun", "İyul", "Avqust", "Sentyabr", "Oktyabr", "Noyabr", "Dekabr"];

function monthKey(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}
function shiftMonth(key, delta) {
  let [y, m] = key.split("-").map(Number);
  m += delta;
  while (m < 1) { m += 12; y--; }
  while (m > 12) { m -= 12; y++; }
  return y + "-" + String(m).padStart(2, "0");
}
function monthLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return MONTHS_AZ[m - 1] + " " + y;
}
function schoolYearLabel(key) {
  const [y, m] = key.split("-").map(Number);
  return m >= 9 ? y + "–" + (y + 1) : (y - 1) + "–" + y;
}
function dateLabel(d) {
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear();
}

/* A mark list is always 5 numbers in CRITERIA order; 0 means "not graded". */
function cleanMarks(arr) {
  const out = [0, 0, 0, 0, 0];
  if (!Array.isArray(arr)) return out;
  for (let i = 0; i < 5; i++) {
    const v = Math.round(Number(arr[i]));
    out[i] = v >= 1 && v <= 5 ? v : 0;
  }
  return out;
}
function mean(values) {
  let s = 0, n = 0;
  for (const v of values) if (v >= 1 && v <= 5) { s += v; n++; }
  return n ? s / n : null;
}
function fmtAvg(x) {
  return x == null ? "—" : (Math.round(x * 100 + 1e-9) / 100).toFixed(2).replace(".", ",");
}

/* marks: { [subjectId]: [a,h,i,n,d] } for one student */
function summarize(subjects, marks) {
  const rows = subjects.map(function (s) {
    const vals = cleanMarks(marks && marks[s.id]);
    return { subject: s, vals: vals, avg: mean(vals), filled: vals.filter(Boolean).length };
  });
  const critAvg = CRITERIA.map(function (c, k) { return mean(rows.map(function (r) { return r.vals[k]; })); });
  const all = [];
  rows.forEach(function (r) { r.vals.forEach(function (v) { all.push(v); }); });
  return {
    rows: rows,
    critAvg: critAvg,
    overall: mean(all),
    complete: rows.filter(function (r) { return r.filled === 5; }).length,
    started: rows.filter(function (r) { return r.filled > 0; }).length,
    total: rows.length
  };
}

/* pdfmake document: one A4 page per student.
   info: { school, head, className, month, generated, subjects }
   students: [{ name, marks, note }] */
function protocolDocDefinition(info, students) {
  const INK = "#1b1f27", MUTED = "#5f6570", LINE = "#8d939e", SOFT = "#b4b9c3", FILL = "#eef0f4", FILL2 = "#dfe3eb";
  const W = 515; // A4 width minus margins

  const lineOnly = {
    defaultBorder: false,
    hLineWidth: function () { return 0.7; },
    vLineWidth: function () { return 0; },
    hLineColor: function () { return INK; },
    paddingLeft: function () { return 0; },
    paddingRight: function () { return 0; },
    paddingTop: function () { return 2; },
    paddingBottom: function () { return 3; }
  };
  const grid = {
    hLineWidth: function (i, node) { const n = node.table.body.length; return (i === 0 || i === n) ? 0.9 : (i === 1 || i === n - 1) ? 0.8 : 0.45; },
    vLineWidth: function (i, node) { return (i === 0 || i === node.table.widths.length) ? 0.9 : 0.45; },
    hLineColor: function (i, node) { const n = node.table.body.length; return (i <= 1 || i >= n - 1) ? INK : LINE; },
    vLineColor: function (i, node) { return (i === 0 || i === node.table.widths.length) ? INK : LINE; },
    paddingLeft: function () { return 4; },
    paddingRight: function () { return 4; },
    paddingTop: function () { return 4.5; },
    paddingBottom: function () { return 4.5; },
    fillColor: function (row) { return row === 0 ? FILL : null; }
  };
  const box = {
    hLineWidth: function () { return 0.8; },
    vLineWidth: function () { return 0.8; },
    hLineColor: function () { return INK; },
    vLineColor: function () { return INK; },
    paddingLeft: function () { return 8; },
    paddingRight: function () { return 8; },
    paddingTop: function () { return 7; },
    paddingBottom: function () { return 8; }
  };
  function rule(width, y, color, weight) {
    return { canvas: [{ type: "line", x1: 0, y1: y, x2: width, y2: y, lineWidth: weight || 0.6, lineColor: color || INK }] };
  }
  function blankWithCaption(width, caption) {
    return { width: width, stack: [rule(width, 16), { text: caption, fontSize: 7, color: MUTED, alignment: "center", margin: [0, 1, 0, 0] }] };
  }
  function filledWithCaption(width, value, caption) {
    return { width: width, stack: [{ text: value, fontSize: 10, margin: [2, 4, 0, 1] }, rule(width, 0), { text: caption, fontSize: 7, color: MUTED, alignment: "center", margin: [0, 1, 0, 0] }] };
  }
  function th(text, singleLine) {
    return { text: text, fontSize: 7.8, bold: true, alignment: "center", color: INK, lineHeight: 1.05, margin: [0, singleLine ? 4.5 : 0, 0, 0] };
  }

  const extra = Math.max(0, (info.subjects || []).length - 5); // tighten spacing for longer subject lists
  const cellPad = extra >= 2 ? 3.2 : 4.5;
  grid.paddingTop = function () { return cellPad; };
  grid.paddingBottom = function () { return cellPad; };

  const content = [];
  students.forEach(function (st, idx) {
    const sum = summarize(info.subjects, st.marks || {});
    const b = [];

    if (info.school) b.push({ text: info.school, alignment: "center", fontSize: 10, bold: true, color: INK });
    b.push(rule(W, 0, INK, 0.9));
    b[b.length - 1].margin = [0, info.school ? 5 : 0, 0, 12];
    b.push({ text: "ŞAGİRDİN AYLIQ QİYMƏTLƏNDİRMƏ PROTOKOLU", alignment: "center", fontSize: 14, bold: true, characterSpacing: 0.5, color: INK });
    b.push({ text: [monthLabel(info.month), schoolYearLabel(info.month) + " tədris ili"].concat(info.group ? [info.group] : []).join("   ·   "), alignment: "center", fontSize: 10, color: MUTED, margin: [0, 4, 0, 16] });

    b.push({
      table: {
        widths: ["auto", "*", "auto", 64],
        body: [[
          { text: "Şagird:", color: MUTED, margin: [0, 3, 8, 0] },
          { text: st.name || "", fontSize: 12.5, bold: true, border: [false, false, false, true] },
          { text: "Sinif:", color: MUTED, margin: [18, 3, 8, 0] },
          { text: info.className || "", fontSize: 12.5, bold: true, alignment: "center", border: [false, false, false, true] }
        ]]
      },
      layout: lineOnly,
      margin: [0, 0, 0, 16]
    });

    const body = [[
      th("№", true),
      Object.assign(th("Fənn", true), { alignment: "left" })
    ].concat(CRITERIA.map(function (c) { return th(c.head, c.head.indexOf("\n") < 0); }), [th("Orta\nbal", false)])];

    sum.rows.forEach(function (r, i) {
      body.push([
        { text: String(i + 1), alignment: "center", color: MUTED, fontSize: 9, margin: [0, 1, 0, 0] },
        { text: r.subject.name, fontSize: 10 }
      ].concat(r.vals.map(function (v) {
        return v ? { text: String(v), alignment: "center", fontSize: 11 } : { text: "—", alignment: "center", color: SOFT };
      }), [{ text: fmtAvg(r.avg), alignment: "center", bold: true, color: r.avg == null ? SOFT : INK }]));
    });
    body.push([
      { text: "Göstərici üzrə orta bal", colSpan: 2, bold: true, fontSize: 9, fillColor: FILL, margin: [0, 1, 0, 0] },
      {}
    ].concat(sum.critAvg.map(function (a) {
      return { text: fmtAvg(a), alignment: "center", bold: true, fontSize: 9.5, fillColor: FILL, color: a == null ? SOFT : INK };
    }), [{ text: fmtAvg(sum.overall), alignment: "center", bold: true, fontSize: 10.5, fillColor: FILL2 }]));

    b.push({ table: { headerRows: 1, dontBreakRows: true, widths: [14, "*", 52, 52, 52, 52, 56, 44], body: body }, layout: grid });

    b.push({
      columns: [
        {
          width: "*",
          stack: [
            { text: "Qiymətləndirmə şkalası (1–5 bal)", fontSize: 8, bold: true, color: MUTED, margin: [0, 0, 0, 3] },
            { text: SCALE.map(function (s) { return s.v + " — " + s.word; }).join(";   "), fontSize: 8.5, color: MUTED },
            { text: "Orta bal bütün fənlər və göstəricilər üzrə qoyulmuş balların ədədi ortasıdır. «—» qiymət qoyulmadığını bildirir.", fontSize: 8, color: MUTED, margin: [0, 4, 0, 0], lineHeight: 1.2 },
            { text: "Qiymətləndirilən fənlər: " + sum.started + " / " + sum.total, fontSize: 8, color: MUTED, margin: [0, 4, 0, 0] }
          ]
        },
        {
          width: 140,
          table: {
            widths: ["*"],
            body: [[{
              alignment: "center",
              stack: [
                { text: "ÜMUMİ ORTA BAL", fontSize: 7.5, bold: true, characterSpacing: 0.6, color: MUTED },
                { text: fmtAvg(sum.overall), fontSize: 24, bold: true, color: INK, margin: [0, 2, 0, 0] },
                { text: "5 bal üzərindən", fontSize: 7.5, color: MUTED }
              ]
            }]]
          },
          layout: box
        }
      ],
      columnGap: 18,
      margin: [0, 12, 0, extra ? 12 : 18]
    });

    const note = String(st.note || "").trim();
    const estLines = note ? note.split(/\n/).reduce(function (n, p) { return n + Math.max(1, Math.ceil(p.length / 92)); }, 0) : 0;
    const blank = Math.max(1, Math.min(6, 6 - estLines - extra));
    const lines = [];
    for (let i = 0; i < blank; i++) lines.push({ type: "line", x1: 0, y1: 19 * (i + 1), x2: W - 16, y2: 19 * (i + 1), lineWidth: 0.4, lineColor: SOFT });
    b.push({ text: "PSİXOLOQ QEYDLƏRİ", fontSize: 9, bold: true, characterSpacing: 0.6, color: INK, margin: [0, 0, 0, 5] });
    b.push({
      table: { widths: ["*"], body: [[{ stack: (note ? [{ text: note, fontSize: 10, lineHeight: 1.3 }] : []).concat([{ canvas: lines }]) }]] },
      layout: box
    });
    b.push({
      columns: [
        { width: "*", text: "" },
        { width: "auto", text: "Psixoloq:", fontSize: 9, color: MUTED, margin: [0, 9, 8, 0] },
        blankWithCaption(170, "(imza)")
      ],
      margin: [0, 2, 0, extra ? 14 : 22]
    });

    b.push({
      unbreakable: true,
      columns: [
        {
          width: "*",
          stack: [
            { text: "VALİDEYN", fontSize: 9, bold: true, characterSpacing: 0.6 },
            { text: "Protokolla tanış oldum.", fontSize: 8.5, italics: true, color: MUTED, margin: [0, 2, 0, 4] },
            blankWithCaption(235, "(soyadı, adı)"),
            { text: "", margin: [0, 4, 0, 0] },
            blankWithCaption(235, "(imza)"),
            { text: "Tarix:  «____» ________________ 20____", fontSize: 9, margin: [0, 12, 0, 0] }
          ]
        },
        {
          width: "*",
          stack: [
            { text: "MƏKTƏB RƏHBƏRİ", fontSize: 9, bold: true, characterSpacing: 0.6 },
            { text: " ", fontSize: 8.5, margin: [0, 2, 0, 4] },
            info.head ? filledWithCaption(235, info.head, "(soyadı, adı)") : blankWithCaption(235, "(soyadı, adı)"),
            { text: "", margin: [0, 4, 0, 0] },
            blankWithCaption(235, "(imza)"),
            { text: "M.Y.", fontSize: 9, bold: true, margin: [0, 12, 0, 0] }
          ]
        }
      ],
      columnGap: 45
    });

    content.push(idx ? { stack: b, pageBreak: "before" } : { stack: b });
  });

  return {
    pageSize: "A4",
    pageMargins: [40, 34, 40, 44],
    info: {
      title: "Aylıq qiymətləndirmə protokolu — " + (info.className || "") + " — " + monthLabel(info.month),
      author: info.school || "",
      subject: "Şagirdin aylıq qiymətləndirmə protokolu"
    },
    content: content,
    defaultStyle: { font: "Roboto", fontSize: 10, color: INK, lineHeight: 1.15 },
    footer: function () {
      return {
        columns: [
          { text: (info.className ? info.className + " sinfi · " : "") + monthLabel(info.month), fontSize: 7.5, color: MUTED },
          { text: "Tərtib tarixi: " + info.generated, fontSize: 7.5, color: MUTED, alignment: "right" }
        ],
        margin: [40, 16, 40, 0]
      };
    }
  };
}


/* ===== App ===== */
const PDF_LIBS = [
  "https://cdn.jsdelivr.net/npm/pdfmake@0.2.23/build/pdfmake.min.js",
  "https://cdn.jsdelivr.net/npm/pdfmake@0.2.23/build/vfs_fonts.js"
];
const NOTE_MAX = 600;
const TOKEN_KEY = "qiymet-token-v1";
const PREF_KEY = "qiymet-prefs-v1";
const API_URL = String(window.QIYMET_API_URL || "").trim();
const IN_GAS = typeof google !== "undefined" && !!(google.script && google.script.run);
const TAB_IDS = ["grade", "notes", "reports"];
const TAB_HASH = { qiymet: "grade", psixoloq: "notes", protokollar: "reports" };
const ROLE_LABELS = { admin: "Admin", teacher: "Müəllim", psych: "Psixoloq", homeroom: "Sinif rəhbəri" };
const FRESH_MS = 60000;

const S = {
  token: null, boot: null,
  tab: "grade", month: monthKey(new Date()), cls: null, subject: null,
  cache: {}, reports: {}, pending: {},
  lastSaved: 0, trouble: "", notice: "", expanded: new Set(), pdfBusy: null
};

/* ---------- helpers ---------- */
function $(sel, root) { return (root || document).querySelector(sel); }
function h(tag, props, kids) {
  const n = document.createElement(tag);
  if (props) {
    for (const k in props) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "value") n.value = v;
      else if (k === "hidden") n.hidden = true;
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : String(v));
    }
  }
  if (kids != null) {
    (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      n.append(c.nodeType ? c : document.createTextNode(String(c)));
    });
  }
  return n;
}
function icon() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("fill", "none");
  svg.setAttribute("stroke", "currentColor");
  svg.setAttribute("stroke-width", "1.7");
  svg.setAttribute("stroke-linecap", "round");
  svg.setAttribute("stroke-linejoin", "round");
  const p = document.createElementNS(ns, "path");
  p.setAttribute("d", "M8 2.5v8M4.8 7.6 8 10.8l3.2-3.2M3 13.5h10");
  p.setAttribute("fill", "none");
  svg.append(p);
  return svg;
}
function has(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }
function store(key, value) { try { if (value) localStorage.setItem(key, value); else localStorage.removeItem(key); } catch (e) { /* storage unavailable */ } }
function load(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
function loadPrefs() { try { return JSON.parse(load(PREF_KEY) || "{}") || {}; } catch (e) { return {}; } }
function savePrefs() { store(PREF_KEY, JSON.stringify({ tab: S.tab, cls: S.cls, subject: S.subject })); }
function safeName(s) { return s.replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim().slice(0, 150); }
function timeLabel(t) {
  const d = new Date(t);
  return String(d.getDate()).padStart(2, "0") + "." + String(d.getMonth() + 1).padStart(2, "0") + ", " +
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
let toastTimer = null;
function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.dataset.bad = bad ? "1" : "";
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.hidden = true; }, bad ? 6500 : 4000);
}

/* ---------- server ---------- */
function rawCall(payload) {
  if (IN_GAS) {
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (text) {
          try { resolve(JSON.parse(text)); } catch (e) { reject({ code: "network", message: "Serverin cavabı oxunmadı." }); }
        })
        .withFailureHandler(function () { reject({ code: "network", message: "Serverə qoşulmaq alınmadı. İnterneti yoxlayın." }); })
        .api(JSON.stringify(payload));
    });
  }

  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(function (r) {

async function call(action, data) {

/* ---------- permissions and selection ---------- */
function perm(tab) {
  const p = S.boot && S.boot.perm && S.boot.perm[tab];
  return p || { classes: [], subjects: [], byClass: {} };
}
function availableTabs() {
  if (!S.boot) return [];
  return TAB_IDS.filter(function (t) {
    const p = perm(t);
    return p.classes.length && (t !== "grade" || (p.subjects && p.subjects.length));
  });
}
/** Subjects this user may grade in the given class. */
function gradeSubjects(cls) {
  const p = perm("grade");
  return (cls && p.byClass && p.byClass[cls]) || [];
}
function ensureSelection() {
  const tabs = availableTabs();
  if (tabs.indexOf(S.tab) < 0) S.tab = tabs[0] || "grade";
  const classes = perm(S.tab).classes;
  if (classes.indexOf(S.cls) < 0) S.cls = classes[0] || null;
  if (S.tab === "grade") {
    const subs = gradeSubjects(S.cls);
    if (subs.indexOf(S.subject) < 0) S.subject = subs[0] || null;
  }
}
function classData(name) {
  return (S.boot && S.boot.classes.find(function (c) { return c.name === name; })) || null;
}
/** Subjects evaluated in a class, in the order of the Fənlər sheet. */
function classSubjects(name) {
  const c = classData(name);
  const list = c && c.subjects && c.subjects.length ? c.subjects : (S.boot ? S.boot.subjects : []);
  return list.map(function (n) { return { id: n, name: n }; });
}
function gKey(month, cls, subject) { return ["g", month, cls, subject].join("|"); }
function nKey(month, cls) { return ["n", month, cls].join("|"); }
function rKey(month, cls) { return ["r", month, cls].join("|"); }

  const p = S.pending[key];

}

/* ---------- loading ---------- */
async function loadKey(key, force) {
  const old = S.cache[key];
  if (old && (old.loading || (!force && old.t && Date.now() - old.t < FRESH_MS))) return;
  S.cache[key] = Object.assign({ entries: {}, by: "", at: 0, t: 0 }, old || {}, { loading: true, error: "" });
  renderView();
  const parts = key.split("|");
  try {
    const res = parts[0] === "g"
      ? await call("grades", { month: parts[1], cls: parts[2], subject: parts[3] })
      : await call("notes", { month: parts[1], cls: parts[2] });
    S.cache[key] = { entries: res.entries || {}, by: res.by || "", at: res.at || 0, t: Date.now(), loading: false, error: "" };
  } catch (e) {
    S.cache[key] = Object.assign({}, S.cache[key], { loading: false, error: e.message || "Yükləmək alınmadı." });
  }
  renderView();
}
async function loadReport(key, force) {
  const old = S.reports[key];
  if (old && (old.loading || (!force && old.t && Date.now() - old.t < FRESH_MS))) return;
  S.reports[key] = Object.assign({ grades: {}, by: {}, notes: {}, t: 0 }, old || {}, { loading: true, error: "" });
  renderView();
  const parts = key.split("|");
  try {
    const res = await call("report", { month: parts[1], cls: parts[2] });
    S.reports[key] = { grades: res.grades || {}, by: res.by || {}, notes: res.notes || {}, t: Date.now(), loading: false, error: "" };
  } catch (e) {
    S.reports[key] = Object.assign({}, S.reports[key], { loading: false, error: e.message || "Yükləmək alınmadı." });
  }
  renderView();
}
function ensureData() {
  if (!S.boot || !S.cls) return;
  if (S.tab === "grade" && S.subject) loadKey(gKey(S.month, S.cls, S.subject), false);
  else if (S.tab === "notes") loadKey(nKey(S.month, S.cls), false);
  else if (S.tab === "reports") loadReport(rKey(S.month, S.cls), false);
}

/* ---------- saving: one queue per sheet (month · class · subject) ---------- */
const Q = {};
function hasPending() { return Object.keys(S.pending).some(function (k) { return Object.keys(S.pending[k]).length; }); }
function queueEdit(key, sid, val, delay) {
  if (!S.pending[key]) S.pending[key] = {};
  S.pending[key][sid] = val;
  const q = Q[key] || (Q[key] = { timer: null, running: null, retries: 0 });
  clearTimeout(q.timer);
  q.timer = setTimeout(function () { flush(key); }, delay);
  renderSaveState();
}
function flushAll() { return Promise.all(Object.keys(S.pending).map(function (k) { return flush(k); })); }
async function flush(key) {
  const q = Q[key] || (Q[key] = { timer: null, running: null, retries: 0 });
  if (q.running) return q.running;
  clearTimeout(q.timer);
  q.timer = null;
  const pend = S.pending[key];
  if (!pend || !Object.keys(pend).length || !S.token) return;
  const batch = Object.assign({}, pend);
  const parts = key.split("|");
  q.running = (async function () {
    try {
      const res = parts[0] === "g"
        ? await call("saveGrades", { month: parts[1], cls: parts[2], subject: parts[3], entries: batch })
        : await call("saveNotes", { month: parts[1], cls: parts[2], entries: batch });
      q.retries = 0;
      S.trouble = "";
      S.lastSaved = Date.now();
      const c = S.cache[key];
      if (c) {
        c.entries = Object.assign({}, c.entries, batch);
        c.by = S.boot && S.boot.user ? S.boot.user.name : c.by;
        c.at = res.at || Date.now();
      }
      delete S.reports[rKey(parts[1], parts[2])];
      const cur = S.pending[key] || {};
      Object.keys(batch).forEach(function (sid) { if (cur[sid] === batch[sid]) delete cur[sid]; });
      if (!Object.keys(cur).length) delete S.pending[key];
      return true;
    } catch (e) {
      if (e.code === "auth") { S.trouble = "retry"; return false; }
      if (e.code === "forbidden" || e.code === "bad_request" || e.code === "setup") {
        delete S.pending[key];
        S.trouble = "";
        toast(e.message || "Dəyişiklik qəbul edilmədi.", true);
        return false;
      }
      q.retries += 1;
      if (q.retries <= 6) {
        S.trouble = "retry";
        q.timer = setTimeout(function () { flush(key); }, Math.min(30000, 1500 * Math.pow(2, q.retries)) + Math.random() * 800);
      } else {
        S.trouble = "error";
        toast("Bağlantı problemi: son dəyişikliklər hələ yadda saxlanmayıb. Səhifəni bağlamayın.", true);
      }
      return false;
    }
  })();
  const ok = await q.running;
  q.running = null;
  if (ok && S.pending[key]) flush(key);
  renderSaveState();
  if (S.tab !== "reports") renderView();
  return ok;
}

    if (document.activeElement !== ta && !has(pend, sid) && ta.value !== val) ta.value = val;
    autosize(ta);
    ta.disabled = firstLoad;
    ta.parentNode.querySelector(".count").textContent = ta.value.length ? ta.value.length + " / " + NOTE_MAX : "";
    if (val.trim()) n++;
  });
  const meta = $("#notesMeta");
  if (meta) {
    let text = "Yüklənir…";
    if (!firstLoad) {
      text = n + " / " + v.querySelectorAll("textarea[data-sid]").length + " şagird üçün qeyd yazılıb";
      if (c.by) text += " · son yazan: " + c.by + (c.at ? ", " + timeLabel(c.at) : "");
    }
    meta.textContent = text;
  }
  const banner = $("#notesBanner");
  if (banner) {
    if (c && c.error) { banner.replaceChildren(h("span", { text: c.error }), retryButton(function () { loadKey(key, true); })); banner.hidden = false; }
    else banner.hidden = true;
  }
}

/* ---------- reports ---------- */
function avgChip(x, big) {
  return h("span", { class: "avg" + (big ? " big" : ""), "data-g": x == null ? "" : String(Math.round(x)), text: fmtAvg(x) });
}
/** Server data plus anything typed on this device that is not saved yet. */
function reportData(month, cls) {
  const r = S.reports[rKey(month, cls.name)];
  const subs = classSubjects(cls.name);
  const nk = nKey(month, cls.name);
  return cls.students.map(function (st) {
    const marks = {};
    subs.forEach(function (s) {
      const pk = gKey(month, cls.name, s.id);
      marks[s.id] = cleanMarks(has(S.pending[pk], st.id) ? S.pending[pk][st.id] : (r && r.grades[s.id] ? r.grades[s.id][st.id] : null));
    });
    const note = has(S.pending[nk], st.id) ? S.pending[nk][st.id] : (r && r.notes ? r.notes[st.id] : "");
    return { st: st, marks: marks, note: String(note || ""), sum: summarize(subs, marks) };
  });
}
function renderReports() {
  const v = $("#view-reports");
  const cls = classGuard(v);
  if (!cls) return;
  v.dataset.key = "r";
  const key = rKey(S.month, cls.name);
  const r = S.reports[key];
  const loaded = !!(r && r.t);
  const subs = classSubjects(cls.name);
  const rows = loaded ? reportData(S.month, cls) : [];
  const classAvg = mean(rows.map(function (x) { return x.sum.overall; }).filter(function (a) { return a != null; }));
  const busy = !!S.pdfBusy;

  const head = h("div", { class: "sheet-head" }, [
    h("div", { class: "sheet-title" }, [
      h("h2", { text: [cls.name, cls.group, monthLabel(S.month)].filter(Boolean).join(" · ") }),
      h("p", { class: "meta", text: loaded ? "Sinif üzrə orta bal: " + fmtAvg(classAvg) + " · " + cls.students.length + " şagird" + (r.loading ? " · yenilənir…" : "") : (r && r.error ? "" : "Yüklənir…") })
    ]),
    h("div", { class: "head-actions" }, [
      h("button", { class: "btn small", type: "button", disabled: !!(r && r.loading), onclick: function () { loadReport(key, true); }, text: "Yenilə" }),
      h("button", { class: "btn primary", type: "button", disabled: !loaded || busy, onclick: function () { exportPdf(null); } },
        S.pdfBusy === "*" ? "Hazırlanır…" : [icon(), "Bütün sinif — PDF"])
    ])
  ]);
  if (r && r.error && !loaded) {
    v.replaceChildren(head, h("div", { class: "banner bad" }, [h("span", { text: r.error }), retryButton(function () { loadReport(key, true); })]));
    return;
  }
  if (!loaded) { v.replaceChildren(head); return; }

  const comp = h("div", { class: "completion", "aria-label": "Fənlər üzrə doldurulma" }, subs.map(function (s) {
    let done = 0, started = 0;
    rows.forEach(function (x) { const m = x.marks[s.id]; if (m.every(Boolean)) done++; if (m.some(Boolean)) started++; });
    const pct = rows.length ? Math.round(done / rows.length * 100) : 0;
    const who = r.by && r.by[s.id] ? r.by[s.id] : "";
    return h("div", { class: "comp" + (rows.length && done === rows.length ? " full" : "") }, [
      h("div", { class: "comp-top" }, [h("span", { class: "comp-name", text: s.name }), h("span", { class: "comp-num", text: done + " / " + rows.length })]),
      h("div", { class: "bar" }, h("i", { style: "width:" + pct + "%" })),
      h("div", { class: "comp-who", text: !started ? "Hələ başlanmayıb" : (who ? "Yazan: " + who : "Doldurulur") })
    ]);
  }));

  const thead = h("thead", {}, h("tr", {}, [h("th", { class: "c-no", text: "№" }), h("th", { text: "Şagird" })]
    .concat(subs.map(function (s) { return h("th", { class: "col-subj ta-c", text: s.name }); }),
      [h("th", { class: "ta-c", text: "Ümumi orta" }), h("th", { class: "ta-r" }, h("span", { class: "sr", text: "Protokol" }))])));
  const tbody = h("tbody");
  rows.forEach(function (x, i) {
    const open = S.expanded.has(x.st.id);
    tbody.append(h("tr", { class: open ? "open" : null }, [
      h("td", { class: "c-no", text: String(i + 1) }),
      h("td", {}, h("button", {
        class: "linkish", type: "button", "aria-expanded": open ? "true" : "false",
        onclick: function () { if (S.expanded.has(x.st.id)) S.expanded.delete(x.st.id); else S.expanded.add(x.st.id); renderReports(); }
      }, [
        h("span", { class: "sname", text: x.st.name }),
        h("span", { class: "sub", text: x.sum.started + " / " + x.sum.total + " fənn" + (x.note.trim() ? " · psixoloq qeydi var" : "") })
      ]))
    ].concat(x.sum.rows.map(function (row) { return h("td", { class: "col-subj ta-c" }, avgChip(row.avg)); }), [
      h("td", { class: "ta-c" }, avgChip(x.sum.overall, true)),
      h("td", { class: "ta-r" }, h("button", {
        class: "btn small", type: "button", disabled: busy, "aria-label": x.st.name + " — protokolu PDF kimi yüklə",
        onclick: function () { exportPdf(x.st.id); }
      }, S.pdfBusy === x.st.id ? "Hazırlanır…" : [icon(), "PDF"]))
    ])));
    if (open) tbody.append(h("tr", { class: "detail" }, h("td", { colspan: String(4 + subs.length) }, detailBlock(x))));
  });
  v.replaceChildren(head, comp, h("div", { class: "tablewrap" }, h("table", { class: "rep" }, [thead, tbody])));
}
function detailBlock(x) {
  const mini = h("table", { class: "mini" }, [
    h("thead", {}, h("tr", {}, [h("th", { text: "Fənn" })]
      .concat(CRITERIA.map(function (c) { return h("th", { class: "ta-c", text: c.label }); }), [h("th", { class: "ta-c", text: "Orta" })]))),
    h("tbody", {}, x.sum.rows.map(function (row) {
      return h("tr", {}, [h("td", { text: row.subject.name })]
        .concat(row.vals.map(function (n) { return h("td", { class: "ta-c" }, n ? h("span", { class: "g", "data-g": n, text: String(n) }) : h("span", { class: "dash", text: "—" })); }),
          [h("td", { class: "ta-c" }, avgChip(row.avg))]));
    }))
  ]);
  return h("div", { class: "detail-inner" }, [
    h("div", { class: "mini-wrap" }, mini),
    h("div", { class: "note-view" }, [h("span", { class: "lab", text: "Psixoloq qeydi" }), h("p", { text: x.note.trim() || "Qeyd yazılmayıb." })])
  ]);
}

/* ---------- PDF ---------- */
let pdfLibPromise = null;
function loadScript(src) {
  return new Promise(function (resolve, reject) {
    const s = document.createElement("script");
    s.src = src;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject({ code: "pdf_lib" }); };
    document.head.appendChild(s);
  });
}
function loadPdfLib() {
  if (!pdfLibPromise) {
    pdfLibPromise = PDF_LIBS.reduce(function (p, src) { return p.then(function () { return loadScript(src); }); }, Promise.resolve())
      .then(function () {
        if (!window.pdfMake || typeof window.pdfMake.createPdf !== "function") throw { code: "pdf_lib" };
        return window.pdfMake;
      });
    pdfLibPromise.catch(function () { pdfLibPromise = null; });
  }
  return pdfLibPromise;
}
function downloadPdf(lib, dd, filename) {
  return new Promise(function (resolve, reject) {
    const timer = setTimeout(function () { reject({ code: "timeout" }); }, 90000);
    try {
      lib.createPdf(dd).download(filename, function () { clearTimeout(timer); resolve(); });
    } catch (e) { clearTimeout(timer); reject(e); }
  });
}
async function exportPdf(sid) {
  if (S.pdfBusy) return;
  const cls = classData(S.cls);
  if (!cls) return;
  const all = reportData(S.month, cls);
  const list = sid ? all.filter(function (x) { return x.st.id === sid; }) : all;
  if (!list.length) return;
  S.pdfBusy = sid || "*";
  renderReports();
  try {
    const lib = await loadPdfLib();
    const info = { school: S.boot.school, head: S.boot.head, className: cls.name, group: cls.group || "", month: S.month, generated: dateLabel(new Date()), subjects: classSubjects(cls.name) };
    const dd = protocolDocDefinition(info, list.map(function (x) { return { name: x.st.name, marks: x.marks, note: x.note }; }));
    const filename = safeName(sid
      ? "Protokol - " + list[0].st.name + " - " + cls.name + " - " + monthLabel(S.month)
      : "Protokollar - " + cls.name + " sinfi - " + monthLabel(S.month)) + ".pdf";
    await downloadPdf(lib, dd, filename);
    toast("PDF yükləndi: " + filename);
  } catch (e) {
    if (e && e.code === "pdf_lib") toast("PDF hazırlamaq üçün lazım olan fayl yüklənmədi. İnterneti yoxlayıb yenidən cəhd edin.", true);
    else toast("PDF hazırlamaq alınmadı. Yenidən cəhd edin.", true);
  } finally {
    S.pdfBusy = null;
    if (S.tab === "reports") renderReports();
  }
}

/* ---------- navigation ---------- */
function setTab(t) {
  if (availableTabs().indexOf(t) < 0) return;
  S.tab = t;
  ensureSelection();
  savePrefs();
  renderAll();
  ensureData();
}
function tabFromHash() { return TAB_HASH[(location.hash || "").replace(/^#/, "")] || null; }
function bindStatic() {
  $("#loginForm").addEventListener("submit", submitLogin);
  $("#logoutBtn").addEventListener("click", logout);
  document.querySelectorAll(".tab").forEach(function (t) { t.addEventListener("click", function () { setTab(t.dataset.tab); }); });
  $("#tabs").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const tabs = Array.from(document.querySelectorAll(".tab")).filter(function (t) { return !t.hidden; });
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
    setTab(next.dataset.tab);
    next.focus();
    e.preventDefault();
  });
  function moveMonth(d) {
    flushAll();
    S.month = shiftMonth(S.month, d);
    S.expanded.clear();
    renderAll();
    ensureData();
  }
  $("#monthPrev").addEventListener("click", function () { moveMonth(-1); });
  $("#monthNext").addEventListener("click", function () { moveMonth(1); });
  $("#classSel").addEventListener("change", function (e) {
    flushAll();
    S.cls = e.target.value || null;
    ensureSelection();
    S.expanded.clear();
    savePrefs();
    renderAll();
    ensureData();
  });
  $("#subjSel").addEventListener("change", function (e) {
    flushAll();
    S.subject = e.target.value || null;
    savePrefs();
    renderAll();
    ensureData();
  });
  window.addEventListener("hashchange", function () { const t = tabFromHash(); if (t) setTab(t); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flushAll(); });
  window.addEventListener("beforeunload", function (e) {
    if (hasPending()) { flushAll(); e.preventDefault(); e.returnValue = ""; }
  });
}

/* ---------- start ---------- */
async function start() {
  bindStatic();
  const prefs = loadPrefs();
  S.tab = tabFromHash() || (TAB_IDS.indexOf(prefs.tab) >= 0 ? prefs.tab : "grade");
  S.cls = prefs.cls || null;
  S.subject = prefs.subject || null;
  if (!IN_GAS && !API_URL) {
    showMessage("Sistem hələ qoşulmayıb", "config.js faylında Apps Script veb tətbiqinin linkini yazın (README faylında 4-cü addım).");
    return;
  }
  S.token = load(TOKEN_KEY) || null;
  if (!S.token) { showLogin(""); return; }
  showMessage(null, "Yüklənir…", true);
  try {
    applyBoot(await call("bootstrap"));
  } catch (e) {
    if (e.code === "auth") return;
    showMessage("Qoşulmaq alınmadı", e.message || "Serverə qoşulmaq alınmadı.", false, retryButton(function () { start2(); }));
  }
}
async function start2() {
  showMessage(null, "Yüklənir…", true);
  try {
    applyBoot(await call("bootstrap"));
  } catch (e) {
    if (e.code === "auth") return;
    showMessage("Qoşulmaq alınmadı", e.message || "Serverə qoşulmaq alınmadı.", false, retryButton(function () { start2(); }));
  }
}
start();
})();
</script>
